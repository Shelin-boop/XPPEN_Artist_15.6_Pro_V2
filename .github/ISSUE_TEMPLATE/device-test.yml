name: Device test report
description: Confirm whether the HID-BPF quirk works with your XP-Pen Artist 15.6 Pro V2
title: "[Test] Artist 15.6 Pro V2 - "
labels: []
body:
  - type: markdown
    attributes:
      value: "This repository supports only the XP-Pen Artist 15.6 Pro V2 with USB ID **28bd:096f**. Please avoid posting serial numbers, private paths, or sensitive HID logs."
  - type: input
    id: distribution
    attributes:
      label: Distribution, desktop and display server
      placeholder: "Kubuntu 26.04, KDE Plasma, Wayland"
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel version
      description: "Output of uname -r"
    validations:
      required: true
  - type: input
    id: libinput
    attributes:
      label: libinput version
      description: "Output of libinput --version"
  - type: input
    id: usb_id
    attributes:
      label: USB ID
      description: "Output of lsusb -d 28bd:096f"
    validations:
      required: true
  - type: checkboxes
    id: tests
    attributes:
      label: Results
      options:
        - label: libinput reports a tablet-pad with eight buttons
        - label: All eight physical pad buttons trigger configured KDE actions
        - label: Dial clockwise works
        - label: Dial counterclockwise works
        - label: Pen and display mapping still work
        - label: All controls still work after a clean reboot, without manually loading BPF
  - type: textarea
    id: details
    attributes:
      label: Additional details and regressions
      description: "If needed, mention firmware (if known) and any side effects. Do not post sensitive keyboard reports."
